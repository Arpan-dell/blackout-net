; BLACKOUT NET firmware. One program for every node; the node's identity is a build flag.
;   pio run -e node_a -t upload      (then node_b, node_c, each with its own board plugged in)
;   pio device monitor
;
; NODE_LAT / NODE_LON: where the node is installed, in degrees (long-press the spot in a maps app).
; Leave both at 0 for "no position"; the laptop monitor then draws the map without distances.

[platformio]
default_envs = node_a

[env]
platform = espressif32@6.9.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@6.6.0
    bblanchon/ArduinoJson@7.2.1

[env:node_a]
build_flags = -DNODE_ID=1 -DNODE_LAT=0.0 -DNODE_LON=0.0

[env:node_b]
build_flags = -DNODE_ID=2 -DNODE_LAT=0.0 -DNODE_LON=0.0

[env:node_c]
build_flags = -DNODE_ID=3 -DNODE_LAT=0.0 -DNODE_LON=0.0
